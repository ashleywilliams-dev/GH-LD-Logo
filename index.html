  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #ffffff; overflow: hidden !important; }
  body { display: flex; justify-content: center; align-items: center; box-sizing: border-box; }
  .lockup { display: flex; flex-direction: column; align-items: center; }
  .title { margin: 0 0 calc(var(--logo-height) * 0.215); font-family: "Funnel Display", "Inter", system-ui, sans-serif; font-weight: 700;
    font-size: var(--title-size); line-height: 1.1; letter-spacing: 0.1em; text-transform: uppercase; color: #440B39; text-align: center; white-space: nowrap; }
  .rule { width: 100%; height: 2px; background: #440B39; border: 0; margin: 0 0 calc(var(--logo-height) * 0.015); }
  /* The logos scale to fit whatever frame they are placed in, so no scrollbars.
     The lockup is about 5.56 times wider than it is tall; the min() below picks
     whichever of the frame's width or height is the limiting dimension. */
  :root {
    --logo-height: min(38vh, 9.4vw);
    --title-size: min(calc(var(--logo-height) * 0.46), 3.3vw);
    --lilly-scale: 1.25;
    /* Distance from the bottom edge of each image to its text baseline, as a
       fraction of image height. Used to line the two baselines up. */
    --gh-baseline: 0.154;
    --lilly-baseline: 0.3065;
    --gap: calc(var(--logo-height) * 0.4);
  }
  .row { display: inline-flex; align-items: flex-end; gap: var(--gap); flex-wrap: nowrap; width: max-content; max-width: 100%;
    /* room for the LillyDirect baseline shift so nothing is clipped */
    padding-bottom: calc(var(--logo-height) * var(--lilly-scale) * var(--lilly-baseline) - var(--logo-height) * var(--gh-baseline)); }
  .logo { height: var(--logo-height); width: auto; object-fit: contain; display: block; flex: 0 1 auto; }
  .logo.lilly { height: calc(var(--logo-height) * var(--lilly-scale));     transform: translateY(calc(var(--logo-height) * var(--lilly-scale) * var(--lilly-baseline) - var(--logo-height) * var(--gh-baseline))); }
  </style>
